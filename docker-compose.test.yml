# Isolated Postgres + Redis for integration tests — never for the dev
# stack. Disposable by design: Postgres data lives on tmpfs (RAM), not a
# named volume, so every `up` starts from a genuinely empty database and
# there's nothing to remember to `down -v`. Ports default to values that
# don't collide with docker-compose.yml's dev stack, so both can run at
# once. Used identically by local `pnpm test:integration` and by CI.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-saas_ai_test}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TEST_POSTGRES_USER:-test} -d ${TEST_POSTGRES_DB:-saas_ai_test}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "${TEST_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
